<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="brand big">📚 StudyHub</div>
      <p class="muted">Sign in to start studying with others on live video.</p>

      <h1 class="login-title">Who's studying today?</h1>

      <label class="field-label" for="login-name">Your name</label>
      <input id="login-name" placeholder="e.g. Aarav" maxlength="30" autocomplete="name" />

      <label class="field-label" for="login-avatar">Pick an avatar</label>
      <div id="avatar-picker" class="avatar-picker"></div>

      <label class="field-label" for="login-language">I study in…</label>
      <select id="login-language">
        <option value="">Choose language…</option>
        <option>English</option><option>Hindi</option><option>Spanish</option><option>French</option>
        <option>German</option><option>Portuguese</option><option>Arabic</option><option>Chinese</option>
        <option>Japanese</option><option>Korean</option><option>Russian</option><option>Other</option>
      </select>

      <label class="field-label" for="login-country">Country</label>
      <select id="login-country">
        <option value="">Choose country…</option>
        <option>India</option><option>United States</option><option>United Kingdom</option><option>Canada</option>
        <option>Australia</option><option>Brazil</option><option>Germany</option><option>France</option>
        <option>Spain</option><option>Mexico</option><option>Japan</option><option>Other</option>
      </select>

      <div id="login-error" class="login-error hidden"></div>
      <button id="btn-login" class="btn primary wide">Enter StudyHub →</button>
      <p class="muted small-print">Your profile is stored only in this browser.</p>
    </div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
